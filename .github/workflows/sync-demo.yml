# Keeps the long-lived `demo` branch (deployed to demo.dirstarter.com) in sync
# with main. Every push to main is merged into `demo`, checked, and pushed only
# when the merge is clean and the checks pass. Otherwise nothing is pushed and a
# `demo-sync` issue reports the failure, so the demo keeps its last good build.
#
# Only runs in dirstarter/dirstarter, so customer copies of the repo skip it.

name: Sync demo branch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: sync-demo

jobs:
  sync:
    if: github.repository == 'dirstarter/dirstarter'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: demo
          fetch-depth: 0

      - name: Merge main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # postinstall runs `prisma generate`, which needs a URL but never connects
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          SKIP_ENV_VALIDATION: 1

      - name: Push demo
        run: git push origin HEAD:demo

      # The push already succeeded, so a failure here must not trigger the report
      - name: Close the open sync issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label demo-sync --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Fixed, main synced into demo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Syncing main into demo failed, nothing was pushed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --label demo-sync --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --label demo-sync --title "Demo branch sync failed" --body "$body"
          fi
